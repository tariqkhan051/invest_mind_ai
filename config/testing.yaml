# Testing environment configuration

environment: testing
debug: false

database:
  echo: false
  pool_size: 1

api:
  cors_origins: []

scheduler:
  enabled: false
  timezone: "Asia/Karachi"

logging:
  level: WARNING
  rotation: "1 MB"
  retention: "1 day"

# Keep collector unit tests on mock JSON endpoints, not live websites.
providers:
  mufap:
    source: http
    nav_path: "/api/nav/daily"
  almeezan:
    source: http
    nav_path: "/api/nav/daily"
  psx:
    source: http
    prices_path: "/historical"
  sbp:
    source: http
    macro_path: "/api/indicators"
  news:
    feeds: []
    feed_url: "https://example.com/news.json"
