# External data provider configuration — see docs/11_DATA_COLLECTION.md
#
# Default: live public sources (MUFAP HTML, PSX timeseries, SBP homepage, news RSS).
# Set source: local only for offline/sample imports.

providers:
  mufap:
    enabled: true
    source: live
    base_url: "https://www.mufap.com.pk"
    nav_path: "/Industry/IndustryStatDaily?tab=3"
    nav_urls:
      - "https://www.mufap.com.pk/Industry/IndustryStatDaily?tab=3"
    shariah_only: true
    auto_create_assets: false
    fund_aliases:
      MIF:
        - "Meezan Islamic Fund"
      MEF:
        - "Meezan Energy Fund"
      AMMF:
        - "Al Meezan Mutual Fund"
        - "Meezan Mutual Fund"
      MCF:
        - "Meezan Cash Fund"
    local_path: "data/imports/mufap_nav.json"
    timeout_seconds: 45
    retry_attempts: 3
  almeezan:
    enabled: true
    source: live
    base_url: "https://www.almeezangroup.com"
    nav_path: "/fund-prices/"
    nav_urls:
      - "https://www.almeezangroup.com/fund-prices/"
    auto_create_assets: false
    fund_aliases:
      MIF:
        - "Meezan Islamic Fund"
      MEF:
        - "Meezan Energy Fund"
      AMMF:
        - "Al Meezan Mutual Fund"
      MCF:
        - "Meezan Cash Fund"
      KMIF:
        - "KSE Meezan Index Fund"
      MBF:
        - "Meezan Balanced Fund"
    local_path: "data/imports/almeezan_nav.json"
    timeout_seconds: 45
    retry_attempts: 3
  psx:
    enabled: true
    source: live
    base_url: "https://dps.psx.com.pk"
    eod_path: "/timeseries/eod/{symbol}"
    symbols:
      - ENGRO
      - MARI
      - MEBL
      - OGDC
      - PPL
      - HUBC
      - SYS
      - LUCK
      - FFC
      - UBL
    history_days: 400
    auto_create_assets: true
    local_path: "data/imports/psx_prices.json"
    timeout_seconds: 45
    retry_attempts: 3
  sbp:
    enabled: true
    source: live
    homepage_url: "https://www.sbp.org.pk/"
    inflation_url: "https://api.worldbank.org/v2/country/PK/indicator/FP.CPI.TOTL.ZG?format=json&per_page=20"
    local_path: "data/imports/sbp_macro.json"
    timeout_seconds: 30
    retry_attempts: 3
  news:
    enabled: true
    feeds:
      - url: "https://www.dawn.com/feeds/business"
      - url: "https://feeds.bbci.co.uk/news/business/rss.xml"
    timeout_seconds: 15
    retry_attempts: 2

health_check:
  interval_minutes: 60

schedules:
  nav_import: "0 18 * * *"
  stock_import: "*/15 9-15 * * 1-5"
  macro_import: "0 8 * * *"
  news_import: "*/10 * * * *"
  portfolio_snapshot: "0 19 * * *"
  recommendation_cycle: "0 20 * * *"
  learning_evaluation: "0 21 * * *"
  daily_report: "0 22 * * *"
