# External data provider configuration — see docs/11_DATA_COLLECTION.md
#
# MVP default: local JSON imports under data/imports/ (generated by scripts/bootstrap.py).
# Switch source to "http" when real provider APIs are available.

providers:
  mufap:
    enabled: true
    source: local
    local_path: "data/imports/mufap_nav.json"
    base_url: "https://www.mufap.com.pk"
    nav_path: "/api/nav/daily"
    timeout_seconds: 30
    retry_attempts: 3
  psx:
    enabled: true
    source: local
    local_path: "data/imports/psx_prices.json"
    base_url: "https://dps.psx.com.pk"
    prices_path: "/historical"
    timeout_seconds: 30
    retry_attempts: 3
  sbp:
    enabled: true
    source: local
    local_path: "data/imports/sbp_macro.json"
    base_url: "https://www.sbp.org.pk"
    macro_path: "/api/indicators"
    timeout_seconds: 30
    retry_attempts: 3
  news:
    enabled: true
    feeds:
      - url: "https://www.dawn.com/feeds/business"
      - url: "https://feeds.bbci.co.uk/news/business/rss.xml"
    timeout_seconds: 15
    retry_attempts: 2

health_check:
  interval_minutes: 60

schedules:
  nav_import: "0 18 * * *"
  stock_import: "*/15 9-15 * * 1-5"
  macro_import: "0 8 * * *"
  news_import: "*/10 * * * *"
  portfolio_snapshot: "0 19 * * *"
  recommendation_cycle: "0 20 * * *"
  learning_evaluation: "0 21 * * *"
  daily_report: "0 22 * * *"
